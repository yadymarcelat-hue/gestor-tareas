<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a20" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Proyectos">
<title>Ingresar · Proyectos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shim.js"></script>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="brand"><b>Proyectos</b>Tareas, hitos y equipo</div>

    <div id="login-view">
      <h1>Ingresar</h1>
      <p class="sub">Entra con el correo con el que te invitaron.</p>
      <form id="login-form" novalidate>
        <label>Correo<input id="email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <div id="login-msg" class="msg err" hidden></div>
        <button class="primary" id="login-btn" type="submit">Ingresar</button>
        <button class="link" type="button" id="to-reset">Olvidé mi contraseña</button>
      </form>
    </div>

    <div id="reset-view" hidden>
      <h1>Recuperar contraseña</h1>
      <p class="sub">Te enviamos un correo con un enlace para crear una contraseña nueva.</p>
      <form id="reset-form" novalidate>
        <label>Correo<input id="reset-email" type="email" autocomplete="email" required></label>
        <div id="reset-msg" class="msg" hidden></div>
        <button class="primary" id="reset-btn" type="submit">Enviar enlace</button>
        <button class="link" type="button" id="to-login">Volver a ingresar</button>
      </form>
    </div>

    <p class="foot">¿No tienes cuenta? Pídele a la administradora una invitación.</p>
  </section>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  let sb;
  try { sb = await window.appAuth.client(); }
  catch (e) { $("login-msg").textContent = "Falta configurar la conexión con Supabase."; $("login-msg").hidden = false; return; }

  const { data } = await sb.auth.getSession();
  if (data.session) { location.replace("/"); return; }

  $("to-reset").onclick = () => { $("login-view").hidden = true; $("reset-view").hidden = false; $("reset-email").value = $("email").value; };
  $("to-login").onclick = () => { $("reset-view").hidden = true; $("login-view").hidden = false; };

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("login-msg"); msg.hidden = true;
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || !password) { msg.textContent = "Escribe tu correo y tu contraseña."; msg.hidden = false; return; }
    $("login-btn").disabled = true; $("login-btn").textContent = "Ingresando…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      msg.textContent = /confirm/i.test(error.message) ? "Tu cuenta aún no está activa. Abre el enlace de invitación que te enviaron." : "El correo o la contraseña no coinciden.";
      msg.hidden = false; $("login-btn").disabled = false; $("login-btn").textContent = "Ingresar";
      return;
    }
    location.replace("/");
  });

  $("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("reset-msg"); msg.hidden = true;
    const email = $("reset-email").value.trim();
    if (!email) { msg.className = "msg err"; msg.textContent = "Escribe tu correo."; msg.hidden = false; return; }
    $("reset-btn").disabled = true;
    let error = "";
    try {
      const r = await fetch("/api/reset", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email }) });
      if (!r.ok) error = (await r.json().catch(() => ({}))).error || "No pudimos enviar el correo. Intenta de nuevo en unos minutos.";
    } catch (e) { error = "No hay conexión. Revisa tu internet e intenta de nuevo."; }
    $("reset-btn").disabled = false;
    msg.className = error ? "msg err" : "msg ok";
    msg.textContent = error || "Listo. Si el correo está registrado, te llegará el enlace en unos minutos. Revisa también spam.";
    msg.hidden = false;
  });
})();
</script>
</body>
</html>
