<html lang="es">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Proyectos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — fixed sidebar + scrolling work area; board columns tinted by state, cards white */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f2f3f6; --hover:#eef0f4; --line:#e5e7ec; --line-2:#d9dce3;
  --fg:#15171c; --muted:#5f6673; --faint:#9399a5;
  --accent:#1667ff; --accent-hover:#0e57e0; --accent-soft:#e7efff; --accent-fg:#ffffff;
  --violet:#7b5cf5; --violet-soft:#efeaff;
  --col-todo:#eceef2; --col-doing:#dbe8ff; --col-review:#fcf1cc; --col-done:#d9f3e2;
  --dot-todo:#9399a5; --dot-doing:#1667ff; --dot-review:#e4a400; --dot-done:#21a55a;
  --p-alta-bg:#fde7e7; --p-alta-fg:#c42b2b; --p-media-bg:#fdf0d3; --p-media-fg:#9a6200; --p-baja-bg:#eef0f3; --p-baja-fg:#4a515d;
  --danger:#d93d42; --danger-soft:#fdecec; --ok:#1d9150; --ok-soft:#e1f5e9; --warn:#a86b00; --warn-soft:#fdf2d8;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 1px 1px rgba(20,24,33,.04);
  --shadow-lg:0 24px 60px -12px rgba(20,24,33,.28),0 4px 14px rgba(20,24,33,.08);
  --scrim:rgba(20,24,33,.38);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --r-lg:16px;
  --av0-bg:#dbe8ff;--av0-fg:#1d4fd8;--av1-bg:#fdf0c8;--av1-fg:#a15c00;--av2-bg:#d3f5ef;--av2-fg:#0f766e;--av3-bg:#fde2e7;--av3-fg:#be123c;--av4-bg:#ebe4ff;--av4-fg:#6d28d9;--av5-bg:#dcf5e3;--av5-fg:#15803d;--av6-bg:#ffe6d5;--av6-fg:#c2410c;--av7-bg:#e2e8f0;--av7-fg:#334155;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a20; --surface-2:#1d2128; --hover:#232832; --line:#292e37; --line-2:#343a45;
  --fg:#e9ebef; --muted:#a2a9b5; --faint:#727a87;
  --accent:#4d8dff; --accent-hover:#6a9fff; --accent-soft:#18284a; --accent-fg:#0b1020;
  --violet:#a08bff; --violet-soft:#2a2346;
  --col-todo:#20242b; --col-doing:#172848; --col-review:#383015; --col-done:#16321f;
  --dot-todo:#8a919d; --dot-doing:#4d8dff; --dot-review:#f0bd2e; --dot-done:#3cc476;
  --p-alta-bg:#3e1d20; --p-alta-fg:#ff8d8d; --p-media-bg:#3a2d10; --p-media-fg:#f2c25c; --p-baja-bg:#262a32; --p-baja-fg:#b7bdc7;
  --danger:#ff6b6f; --danger-soft:#3e1d20; --ok:#4fd389; --ok-soft:#173523; --warn:#f2c25c; --warn-soft:#3a2d10;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);
  --av0-bg:#1c2f55;--av0-fg:#9cc0ff;--av1-bg:#3d3112;--av1-fg:#f6cd6b;--av2-bg:#123a36;--av2-fg:#6ee0cf;--av3-bg:#43202a;--av3-fg:#ff9bb0;--av4-bg:#2f2650;--av4-fg:#c4b2ff;--av5-bg:#173523;--av5-fg:#7ee0a0;--av6-bg:#43281a;--av6-fg:#ffb38a;--av7-bg:#283040;--av7-fg:#c3cbd8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1d2128; --hover:#232832; --line:#292e37; --line-2:#343a45;
  --fg:#e9ebef; --muted:#a2a9b5; --faint:#727a87;
  --accent:#4d8dff; --accent-hover:#6a9fff; --accent-soft:#18284a; --accent-fg:#0b1020;
  --violet:#a08bff; --violet-soft:#2a2346;
  --col-todo:#20242b; --col-doing:#172848; --col-review:#383015; --col-done:#16321f;
  --dot-todo:#8a919d; --dot-doing:#4d8dff; --dot-review:#f0bd2e; --dot-done:#3cc476;
  --p-alta-bg:#3e1d20; --p-alta-fg:#ff8d8d; --p-media-bg:#3a2d10; --p-media-fg:#f2c25c; --p-baja-bg:#262a32; --p-baja-fg:#b7bdc7;
  --danger:#ff6b6f; --danger-soft:#3e1d20; --ok:#4fd389; --ok-soft:#173523; --warn:#f2c25c; --warn-soft:#3a2d10;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);
  --av0-bg:#1c2f55;--av0-fg:#9cc0ff;--av1-bg:#3d3112;--av1-fg:#f6cd6b;--av2-bg:#123a36;--av2-fg:#6ee0cf;--av3-bg:#43202a;--av3-fg:#ff9bb0;--av4-bg:#2f2650;--av4-fg:#c4b2ff;--av5-bg:#173523;--av5-fg:#7ee0a0;--av6-bg:#43281a;--av6-fg:#ffb38a;--av7-bg:#283040;--av7-fg:#c3cbd8;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;flex:none}
.i.sm{width:14px;height:14px}
.i.lg{width:22px;height:22px}
h1,h2,h3{text-wrap:balance;margin:0}

/* Shell */
#app{height:100%}
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px 12px max(12px,env(safe-area-inset-left,0px))}
.ws{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin:0 -12px 10px;padding-left:20px;padding-right:16px}
.ws b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.ws-wrap{flex:1;min-width:0}
.me-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;border-radius:10px;padding:4px;margin:-4px}
.me-btn:hover{background:var(--hover)}
.me-btn .who{min-width:0;display:block}
.ws-btn{display:flex;align-items:center;gap:8px;text-align:left;border-radius:9px;padding:4px 6px;margin:-4px -6px;max-width:100%}
.ws-btn:hover{background:var(--hover)}
.ws-name{min-width:0;display:block}
.ws-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ic-emp{color:#c2410c}
.emp-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.emp-row:last-child{border-bottom:0}
.emp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.emp-row b{font-size:15.5px}
.emp-row .s{color:var(--muted);font-size:13px}
.emp-row .acts{display:flex;align-items:center;gap:6px;flex:none}
.emp-row .acts .tag{height:30px;padding:0 10px}
@media (max-width:600px){.emp-row{flex-wrap:wrap}.emp-row .acts{width:100%;justify-content:flex-end}}
.ws small{display:block;color:var(--faint);font-size:12px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav-sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a,.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:500;color:var(--fg);text-decoration:none;width:100%;text-align:left}
.nav a:hover,.nav button:hover{background:var(--hover)}
.nav .on{background:var(--surface-2);font-weight:600}
.nav .sub{padding-left:22px;font-size:14.5px}
.nav .ic-home{color:#f0a020}.nav .ic-task{color:var(--violet)}.nav .ic-cal{color:var(--violet)}.nav .ic-hito{color:var(--accent)}.nav .ic-team{color:#16a37f}.nav .ic-proj{color:#d0507a}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--line);margin:8px -12px 0;padding-left:20px}
.me .who{min-width:0}
.me .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{color:var(--muted);font-size:12.5px}
.main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.shell{transition:grid-template-columns .18s ease}
.side-tog{flex:none}
@media (min-width:901px){
  .shell.side-collapsed{grid-template-columns:72px minmax(0,1fr)}
  .side-collapsed .side{padding-left:12px;padding-right:12px;align-items:stretch}
  .side-collapsed .ws{justify-content:center;padding-left:12px;padding-right:12px}
  .side-collapsed .ws-wrap{display:none}
  .side-collapsed .nav a,.side-collapsed .nav button{justify-content:center;padding:10px 0}
  .side-collapsed .nav button>span{display:none}
  .side-collapsed .nav-sec{font-size:0;padding:0;height:1px;background:var(--line);margin:10px 6px}
  .side-collapsed .me{flex-direction:column;padding-left:0;padding-right:0;gap:6px;align-items:center}
  .side-collapsed .me-btn{flex:none;margin:0;justify-content:center}
  .side-collapsed .me-btn .who{display:none}
}
@media (max-width:900px){.side-tog{display:none}}
.scrim{display:none}

/* Page head */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px max(24px,env(safe-area-inset-right,0px)) 16px max(24px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ph-title{display:flex;align-items:center;gap:10px;flex:1 1 150px;min-width:0}
.ph-title .badge-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
.ph-title h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn.menu-btn{display:none}
.content{padding:18px max(24px,env(safe-area-inset-right,0px)) 28px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-width:0;flex:1}

/* Buttons & pills */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14.5px;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger-t{color:var(--danger);border-color:transparent;box-shadow:none;background:none;font-weight:600}
.btn.danger-t:hover{background:var(--danger-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:13.5px}
.btn .num{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill .x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%}
.pill .x:hover{background:rgba(127,127,127,.18)}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.link-btn{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.link-btn:hover{text-decoration:underline}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.tabs{display:inline-flex;gap:8px;flex-wrap:wrap}
.tabs .pill .i{width:16px;height:16px}
.tabs .ic-task,.tabs .ic-cal{color:var(--violet)}
.tabs .ic-hito{color:var(--accent)}
.tabs .pill.cur{background:var(--surface-2);border-color:var(--fg);font-weight:600}
.menu-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:240px;max-width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:340px;overflow:auto}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:14.5px}
.pop button:hover{background:var(--hover)}
.pop button.on{background:var(--accent-soft)}
.pop .ck{margin-left:auto;color:var(--accent)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);min-width:0;width:220px}
.search input,.field .search input[type=text]{border:0;outline:0;background:none;min-width:0;flex:1;color:var(--fg);padding:0;box-shadow:none;height:100%}
.search:focus-within{border-color:var(--accent)}

/* Board */
.board-wrap{overflow-x:auto;margin:0 calc(-1*max(24px,env(safe-area-inset-right,0px))) 0 calc(-1*max(24px,env(safe-area-inset-left,0px)));padding:0 max(24px,env(safe-area-inset-right,0px)) 8px max(24px,env(safe-area-inset-left,0px))}
.board{display:grid;grid-template-columns:repeat(4,minmax(272px,1fr));gap:14px;min-width:min-content;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px}
.col-h .cnt{color:var(--muted);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.col-h .dot{width:8px;height:8px;border-radius:50%}
.c-todo{background:var(--col-todo)}.c-todo .dot{background:var(--dot-todo)}
.c-doing{background:var(--col-doing)}.c-doing .dot{background:var(--dot-doing)}
.c-review{background:var(--col-review)}.c-review .dot{background:var(--dot-review)}
.c-done{background:var(--col-done)}.c-done .dot{background:var(--dot-done)}
.col-body{display:flex;flex-direction:column;gap:10px;min-height:120px;border-radius:12px;padding:2px;transition:background .12s}
.col-body.over{background:var(--surface-2);outline:2px dashed var(--line-2);outline-offset:2px}
.drop-line{height:3px;border-radius:3px;background:var(--accent);margin:-6px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.45}
.card-t{font-weight:500;font-size:15px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.is-done{border-color:var(--dot-done)}
.card.is-arch{opacity:.7;border-style:dashed}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.card .tags{flex-wrap:nowrap}
.card .tags .tag{flex:none}
.card .tags .tag.hito{flex:0 1 auto;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:500;max-width:100%;min-width:0}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.hito{background:var(--accent-soft);color:var(--accent)}
.tag.p-alta{background:var(--p-alta-bg);color:var(--p-alta-fg)}
.tag.p-media{background:var(--p-media-bg);color:var(--p-media-fg)}
.tag.p-baja{background:var(--p-baja-bg);color:var(--p-baja-fg)}
.tag.neutral{background:var(--surface-2);color:var(--muted)}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .late{color:var(--danger);font-weight:500}
.people{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.person{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);overflow:hidden}
.av.md{width:30px;height:30px;font-size:12px}
.av.xl{width:84px;height:84px;font-size:28px}
.av-c0{background:var(--av0-bg);color:var(--av0-fg)}.av-c1{background:var(--av1-bg);color:var(--av1-fg)}
.av-c2{background:var(--av2-bg);color:var(--av2-fg)}.av-c3{background:var(--av3-bg);color:var(--av3-fg)}
.av-c4{background:var(--av4-bg);color:var(--av4-fg)}.av-c5{background:var(--av5-bg);color:var(--av5-fg)}
.av-c6{background:var(--av6-bg);color:var(--av6-fg)}.av-c7{background:var(--av7-bg);color:var(--av7-fg)}
.photo-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.photo-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.av.lg{width:36px;height:36px;font-size:13px}
.add-card{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:9px;border:1px dashed var(--line-2);color:var(--muted);font-size:13.5px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.add-card:hover{background:var(--surface);color:var(--fg)}
.empty-col{color:var(--faint);font-size:13px;text-align:center;padding:18px 8px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;font-weight:600}
.panel-b{padding:14px 18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .dot{width:8px;height:8px;border-radius:50%}
.list{display:flex;flex-direction:column}

.legend i.lg-todo{background:color-mix(in srgb,var(--dot-todo) 38%,var(--surface));border:1.5px solid var(--dot-todo)}.legend i.lg-doing{background:color-mix(in srgb,var(--dot-doing) 38%,var(--surface));border:1.5px solid var(--dot-doing)}.legend i.lg-review{background:color-mix(in srgb,var(--dot-review) 42%,var(--surface));border:1.5px solid var(--dot-review)}.legend i.lg-done{background:color-mix(in srgb,var(--dot-done) 38%,var(--surface));border:1.5px solid var(--dot-done)}

.field input[type=text],.field input[type=url],.field input[type=date],.field textarea,.inp{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:10px 12px;outline:0;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.5}

.dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dates input{width:auto;flex:1;min-width:140px}

.sec-h{display:flex;align-items:center;gap:8px;justify-content:space-between}

.rows{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px}

.subrow.done .cb:checked,.crow.done .cb:checked{background:var(--dot-done);border-color:var(--dot-done)}
.cb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:6px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.subrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.subrow .sub-main{display:flex;flex-direction:column;gap:8px;min-width:0}

  .board{grid-template-columns:repeat(4,minmax(270px,82vw));scroll-snap-type:x mandatory}

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const COLS=[
  {id:"todo",name:"Sin empezar"},
  {id:"doing",name:"En progreso"},
  {id:"review",name:"En revisión"},
  {id:"done",name:"Hecho"}
];
const COLNAME=Object.fromEntries(COLS.map(c=>[c.id,c.name]));
const PRI=[["none","Sin prioridad"],["alta","Alta"],["media","Media"],["baja","Baja"]];
const PRINAME=Object.fromEntries(PRI);
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIA=["dom","lun","mar","mié","jue","vie","sáb"];
const UPLOAD_TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",csv:"text/csv",md:"text/markdown",json:"application/json",txt:"text/plain"};
const VIEWS=["inicio","tablero","cronograma","hitos","equipo","proyectos","empresas"];
const TASKV=["tablero","cronograma","hitos"];

/* ---------- icons ---------- */
const P={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tasks:'<path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="10" y="4" width="5" height="11" rx="1.2"/><rect x="17" y="4" width="4" height="7" rx="1.2"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
  folder:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  clip:'<path d="M20 11.5 12.5 19a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 4.7 4.7l-7.5 7.5a1.7 1.7 0 0 1-2.4-2.4L14.5 7.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  up:'<path d="m6 15 6-6 6 6"/>',
  left:'<path d="m15 6-6 6 6 6"/>',
  right:'<path d="m9 6 6 6-6 6"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  sub:'<path d="M6 4v10a3 3 0 0 0 3 3h9M15 14l3 3-3 3"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  comment:'<path d="M4 5h16v11H9l-5 4z"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  reply:'<path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 5 5v1"/>',
  dia:'<path d="M12 3l9 9-9 9-9-9z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  building:'<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ico=(n,c="")=>`<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||""}</svg>`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const fmt=s=>{if(!s)return"";const d=parse(s);return d.getDate()+" "+MES[d.getMonth()]};
const fmtRange=(a,b)=>a&&b?(a===b?fmt(a):fmt(a)+" – "+fmt(b)):a?"Desde "+fmt(a):b?"Hasta "+fmt(b):"";
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const fmtTime=ms=>{const d=new Date(ms);return `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const fmtSize=b=>!b?"":b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":(b/1048576).toFixed(1)+" MB";
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- state ---------- */
const S={
  boot:true, demo:false, demoReason:"", db:null, user:null, assets:null,
  me:{id:null,name:"",avatarUrl:"",isOwner:false}, isOwner:false, canWrite:true,
  members:{}, projects:{}, milestones:{}, tasks:{}, comments:{},
  membersReady:false, projectsReady:false, ownerWritten:false,
  profiles:{}, view:"tablero", projectId:null, person:null, q:"", showArchived:false,
  menu:null, navOpen:false, calStart:null, modal:null, inv:{email:"",name:"",title:"",projects:[],link:"",forName:"",err:"",busy:false},
  sideCollapsed:(()=>{try{return localStorage.getItem("pj-side")==="1"}catch(e){return false}})(),
  ws:null, emp:{list:null,loading:false,err:"",busy:false,result:null,form:{name:"",adminName:"",adminEmail:"",includeMe:false}},
  unTasks:null, unCom:null, subHidden:new Set((()=>{try{return JSON.parse(localStorage.getItem("pj-subhidden")||"[]")}catch(e){return[]}})())
};
function saveHidden(){ls.set("pj-subhidden",JSON.stringify([...S.subHidden]))}

/* ---------- people ---------- */
const prof=id=>S.profiles[id]||null;
const nm=id=>{if(!id)return"Alguien";if(id===S.me.id&&!(prof(id)&&prof(id).name))return S.me.name||"Tú";const p=prof(id);return(p&&p.name)||"Alguien"};
const first=id=>nm(id).split(/\s+/)[0];
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
// Color fijo por persona para las iniciales: el mismo id siempre da el mismo color.
// Si una foto no carga, se muestran las iniciales en su lugar.
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.classList.contains("av")&&t.dataset.i){const sp=document.createElement("span");sp.className=t.className.replace(/\bav\b/,"av av-c"+t.dataset.c);sp.setAttribute("aria-hidden","true");sp.textContent=t.dataset.i;t.replaceWith(sp)}},true);
function avColor(id){let h=0;const k=String(id||"");for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%8}
function av(id,cls=""){
  const p=prof(id);
  if(p&&p.avatarUrl)return `<img class="av ${cls}" src="${esc(p.avatarUrl)}" alt="" loading="lazy" data-i="${esc(initials(nm(id))[0]||"?")}" data-c="${avColor(id)}">`;
  const ini=initials(nm(id))[0]||"?";
  return `<span class="av av-c${avColor(id)} ${cls}" aria-hidden="true">${esc(ini)}</span>`;
}
async function loadProfiles(ids){
  if(S.demo||!S.user)return;
  const need=[...new Set(ids.filter(Boolean))].filter(i=>!S.profiles[i]);
  if(!need.length)return;
  const ps=await S.user.profiles(need);
  Object.assign(S.profiles,ps);
  render();
  if(S.modal)refreshModalPeople();
}

/* ---------- data access ---------- */
const MAPS={members:"members",projects:"projects",milestones:"milestones",tasks:"tasks",comments:"comments"};
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return"No tienes permiso para hacer este cambio.";
  if(c==="quota_exceeded")return"Se llenó el espacio de la herramienta. Borra tareas o archivos viejos.";
  if(c==="resource_exhausted"||c==="rate_limited")return"Demasiados cambios seguidos. Espera unos segundos.";
  if(c==="friendly")return e.message;
  if(c==="too_large")return"El archivo pesa más de 50 MB. Elige uno más liviano.";
  if(c==="unsupported_type")return"Ese tipo de archivo no se puede subir. Agrégalo como enlace.";
  if(c==="revoked")return"Perdiste el acceso a la herramienta.";
  return"No se pudo guardar. Intenta de nuevo.";
}
async function wset(col,id,data){
  if(S.demo){S[MAPS[col]][id]=clone(data);render();return}
  await S.db.collection(col).doc(id).set(data);
}
async function wupd(col,id,patch){
  if(S.demo){S[MAPS[col]][id]=Object.assign(clone(S[MAPS[col]][id]||{}),clone(patch));render();return}
  await S.db.collection(col).doc(id).update(patch);
}
async function wdel(col,id){
  if(S.demo){delete S[MAPS[col]][id];render();return}
  await S.db.collection(col).doc(id).delete();
}
async function safe(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){console.error(e);toast(errMsg(e),true);return false}
}
const mapDocs=snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});return o};

/* ---------- derived ---------- */
const memberIds=()=>Object.keys(S.members);
function visibleProjects(){
  return Object.entries(S.projects).map(([id,p])=>({id,...p}))
    .filter(p=>!p.archived&&(S.isOwner||S.demo||(p.memberIds||[]).includes(S.me.id)))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
const curProject=()=>S.projectId&&S.projects[S.projectId]?{id:S.projectId,...S.projects[S.projectId]}:null;
function projectPeople(){
  const p=curProject();if(!p)return[];
  const ids=new Set(p.memberIds||[]);
  if(p.ownerId)ids.add(p.ownerId);
  return [...ids].filter(id=>S.members[id]||id===p.ownerId);
}
const projHitosOn=(id,p)=>!!p&&(p.useHitos===true||(p.useHitos===undefined&&Object.values(S.milestones).some(m=>m.projectId===id)));
const hitosOn=()=>projHitosOn(S.projectId,S.projects[S.projectId]);
const projMilestones=()=>!hitosOn()?[]:Object.entries(S.milestones).map(([id,m])=>({id,...m})).filter(m=>m.projectId===S.projectId).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
const taskList=()=>Object.entries(S.tasks).map(([id,t])=>({id,...t})).filter(t=>t.projectId===S.projectId);
function filteredTasks(){
  const q=S.q.trim().toLowerCase();
  return taskList().filter(t=>(S.showArchived||!t.archived)
    &&(!S.person||(t.assignees||[]).includes(S.person)||(t.subtasks||[]).some(s=>s.assignee===S.person))
    &&(!q||(t.title||"").toLowerCase().includes(q)||(t.description||"").toLowerCase().includes(q)));
}
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const isLate=t=>t.end&&t.column!=="done"&&t.end<today();
function hitoStats(mid){
  const ts=taskList().filter(t=>t.milestoneId===mid&&!t.archived);
  const done=ts.filter(t=>t.column==="done").length;
  return{total:ts.length,done,complete:ts.length>0&&done===ts.length};
}

/* ---------- rendering: shell ---------- */
function render(){
  const app=$("#app");
  const f=captureFocus();
  if(S.boot){app.innerHTML=`<div class="gate"><div class="gate-card"><div class="spinner" aria-hidden="true"></div><p>Cargando tus proyectos…</p></div></div>`;return}
  const noWs=!S.demo&&S.ws&&!S.ws.current;
  if(noWs&&!S.ws.isSuperadmin){app.innerHTML=gateNoAccess();return}
  if(noWs&&S.ws.isSuperadmin)S.view="empresas";
  if(!noWs&&!S.demo&&!S.isOwner&&S.membersReady&&!S.members[S.me.id]){app.innerHTML=gateNoAccess();return}
  app.innerHTML=`<div class="shell ${S.navOpen?"nav-open":""} ${S.sideCollapsed?"side-collapsed":""}">${sidebar()}<main class="main" id="main">${S.demo?demoBanner():""}${view()}</main><div class="scrim" data-act="nav-close"></div></div>`;
  bindBoard();
  restoreFocus(f);
}
function captureFocus(){
  const a=document.activeElement;
  if(!a||!a.id||!$("#app").contains(a))return null;
  return{id:a.id,s:a.selectionStart,e:a.selectionEnd};
}
function restoreFocus(f){
  if(!f)return;const el=document.getElementById(f.id);if(!el)return;
  el.focus({preventScroll:true});
  try{if(f.s!=null)el.setSelectionRange(f.s,f.e)}catch(e){}
}
function gateNoAccess(){
  return `<div class="gate"><div class="gate-card">${ico("lock","lg")}
  <h1>Aún no tienes acceso</h1>
  <p>Entraste como <b>${esc(S.me.name||"tu cuenta")}</b>, pero todavía no perteneces a ninguna empresa. Pídele a la administradora de tu empresa que te invite.</p><button class="btn" data-act="logout">Cerrar sesión</button></div></div>`;
}
function demoBanner(){
  const why="Falta configurar la conexión con Supabase (revisa las variables de entorno en Vercel).";
  return `<div class="demo-banner">${ico("info","sm")}<span><b>Vista de ejemplo.</b> Los proyectos, personas y tareas son de muestra y no se guardan. ${why}</span></div>`;
}
function wsName(){return S.demo?"Ingenio SAS":(S.ws&&S.ws.current?S.ws.current.name:"Sin empresa")}
function wsPop(){
  if(!S.ws)return"";
  return `<div class="pop" role="menu">${S.ws.list.map(w=>`<button class="${S.ws.current&&w.id===S.ws.current.id?"on":""}" data-act="ws-switch" data-id="${esc(w.id)}">${ico("building","sm")}<span>${esc(w.name)}</span>${S.ws.current&&w.id===S.ws.current.id?`<span class="ck">${ico("check","sm")}</span>`:""}</button>`).join("")||`<div class="hint" style="padding:10px">Aún no perteneces a ninguna empresa.</div>`}
  ${S.ws.current&&(S.ws.current.role==="admin"||S.ws.isSuperadmin)?`<hr><button data-act="ws-rename" data-id="${esc(S.ws.current.id)}">${ico("edit","sm")}<span>Cambiar nombre de la empresa</span></button>`:""}
  ${S.ws.isSuperadmin?`<hr><button data-act="go" data-v="empresas">${ico("building","sm")}<span>Administrar empresas</span></button>`:""}</div>`;
}
function toggleSide(){S.sideCollapsed=!S.sideCollapsed;try{localStorage.setItem("pj-side",S.sideCollapsed?"1":"0")}catch(e){}S.menu=null;render()}
function sidebar(){
  const v=S.view;
  const a=(id,label,ic,cls,sub)=>`<button class="${v===id||(id==="tablero"&&TASKV.includes(v))?"on":""} ${sub?"sub":""}" data-act="go" data-v="${id}" title="${label}">${ico(ic,cls)}<span>${label}</span></button>`;
  const role=S.isOwner?"Administradora":((S.members[S.me.id]&&S.members[S.me.id].title)||"Miembro");
  return `<aside class="side" aria-label="Navegación">
    <div class="ws"><div class="menu-wrap ws-wrap"><button class="ws-btn" data-act="menu" data-m="ws" aria-expanded="${S.menu==="ws"}"><span class="ws-name"><b>${esc(wsName())}</b><small>Proyectos</small></span>${S.demo||(S.ws&&(S.ws.list.length>1||S.ws.isSuperadmin))?ico("down","sm"):""}</button>${S.menu==="ws"?wsPop():""}</div><button class="icon-btn side-tog" data-act="side-toggle" aria-label="${S.sideCollapsed?"Expandir menú":"Colapsar menú"}" title="${S.sideCollapsed?"Expandir menú":"Colapsar menú"} (Ctrl+B)">${ico("panel")}</button><button class="icon-btn menu-btn" data-act="nav-close" aria-label="Cerrar menú">${ico("x")}</button></div>
    <nav class="nav">
      ${a("inicio","Inicio","home","ic-home")}
      ${a("tablero","Tareas","tasks","ic-task")}
      <div class="nav-sec">Organización</div>
      ${a("equipo","Equipo","users","ic-team")}
      ${a("proyectos","Proyectos","folder","ic-proj")}
      ${S.ws&&S.ws.isSuperadmin?a("empresas","Empresas","building","ic-emp"):""}
    </nav>
    <div class="me"><button class="me-btn" data-act="my-profile" title="Editar mi perfil">${av(S.me.id,"lg")}<span class="who"><b>${esc(S.me.id?nm(S.me.id):(S.me.name||"Invitado"))}</b><small>${esc(S.demo?"Ejemplo":role)}</small></span></button><button class="icon-btn" data-act="logout" aria-label="Cerrar sesión" title="Cerrar sesión">${ico("logout")}</button></div>
  </aside>`;
}
function head(title,ic,actions=""){
  return `<header class="ph"><button class="icon-btn menu-btn" data-act="nav-open" aria-label="Abrir menú">${ico("menu")}</button>
  <div class="ph-title"><span class="badge-ic">${ico(ic)}</span><h1>${esc(title)}</h1></div><div class="ph-actions">${actions}</div></header>`;
}
function projectSwitcher(){
  const ps=visibleProjects();const cur=curProject();
  const open=S.menu==="project";
  return `<div class="menu-wrap"><button class="pill" data-act="menu" data-m="project" aria-expanded="${open}">${ico("users","sm")}<span>${esc(cur?cur.name:"Elegir proyecto")}</span>${ico("down","sm")}</button>
  ${open?`<div class="pop" role="menu">${ps.map(p=>`<button class="${p.id===S.projectId?"on":""}" data-act="pick-project" data-id="${p.id}">${ico("users","sm")}<span>${esc(p.name)}</span>${p.id===S.projectId?`<span class="ck">${ico("check","sm")}</span>`:""}</button>`).join("")||`<div class="hint" style="padding:10px">No hay proyectos todavía.</div>`}
  ${S.isOwner||S.demo?`<hr><button data-act="go" data-v="proyectos">${ico("folder","sm")}<span>Gestionar proyectos</span></button>`:""}</div>`:""}</div>`;
}
function personFilter(){
  const open=S.menu==="person";
  if(S.person){
    return `<div class="menu-wrap"><span class="pill sel">${av(S.person)}<button data-act="menu" data-m="person">${esc(nm(S.person))}</button><button class="x" data-act="person-clear" aria-label="Quitar filtro">${ico("x","sm")}</button></span>${open?personPop():""}</div>`;
  }
  return `<div class="menu-wrap"><button class="pill" data-act="menu" data-m="person" aria-expanded="${open}">${ico("users","sm")}<span>Todas las personas</span>${ico("down","sm")}</button>${open?personPop():""}</div>`;
}
function personPop(){
  const ids=projectPeople();
  return `<div class="pop" role="menu">${ids.map(id=>`<button class="${id===S.person?"on":""}" data-act="person" data-id="${id}">${av(id)}<span>${esc(nm(id))}</span>${id===S.person?`<span class="ck">${ico("check","sm")}</span>`:""}</button>`).join("")||`<div class="hint" style="padding:10px">Este proyecto no tiene personas asignadas.</div>`}</div>`;
}
function searchBox(){
  return `<label class="search">${ico("search","sm")}<input id="q" type="text" placeholder="Buscar tareas" value="${esc(S.q)}" aria-label="Buscar tareas"></label>`;
}
function viewTabs(){
  const t=[["tablero","Tablero","board","ic-task"],["cronograma","Cronograma","cal","ic-cal"]];if(hitosOn())t.push(["hitos","Hitos","flag","ic-hito"]);
  return `<div class="tabs" aria-label="Vistas de tareas">${t.map(([id,l,ic,cls])=>`<button class="pill ${S.view===id?"cur":""}" aria-current="${S.view===id?"page":"false"}" data-act="go" data-v="${id}">${ico(ic,cls)}${l}</button>`).join("")}</div>`;
}
function noProject(){
  const can=S.isOwner||S.demo;
  return `<div class="content"><div class="panel"><div class="empty">${ico("folder","lg")}
    <h3>${can?"Crea tu primer proyecto":"Todavía no estás en ningún proyecto"}</h3>
    <p>${can?"Un proyecto agrupa los hitos, las tareas y las personas que trabajan en él. Solo tú puedes crear proyectos.":"Cuando la administradora te agregue a un proyecto, aparecerá aquí."}</p>
    ${can?`<button class="btn primary" data-act="new-project">${ico("plus","sm")}Nuevo proyecto</button>`:""}</div></div></div>`;
}

/* ---------- views ---------- */
function view(){
  switch(S.view){
    case "inicio":return viewInicio();
    case "cronograma":return viewCrono();
    case "hitos":return hitosOn()||!curProject()?viewHitos():viewTablero();
    case "equipo":return viewEquipo();
    case "proyectos":return viewProyectos();
    case "empresas":return viewEmpresas();
    default:return viewTablero();
  }
}
function hitosBtn(){
  if(!hitosOn())return"";
  const ms=projMilestones();const done=ms.filter(m=>hitoStats(m.id).complete).length;
  return `<button class="btn" data-act="go" data-v="hitos">${ico("flag","sm")}<span class="hide-sm">Hitos</span> <span class="num">${done}/${ms.length}</span></button>`;
}
function newTaskBtn(){return S.canWrite&&curProject()?`<button class="btn primary" data-act="new-task">${ico("plus","sm")}<span>Nueva tarea</span></button>`:""}

function viewTablero(){
  const h=head("Tareas","tasks",curProject()?hitosBtn()+newTaskBtn():"");
  if(!curProject())return h+noProject();
  const ts=filteredTasks();
  const archived=taskList().filter(t=>t.archived).length;
  return h+`<div class="content">
    <div class="toolbar">${projectSwitcher()}${personFilter()}${searchBox()}${viewTabs()}
      ${S.hitoOnly&&S.milestones[S.hitoOnly]?`<span class="pill sel">${ico("flag","sm")}<span>${esc(S.milestones[S.hitoOnly].name)}</span><button class="x" data-act="hito-only-clear" aria-label="Quitar filtro de hito">${ico("x","sm")}</button></span>`:""}
      <span class="grow"></span>
      ${archived?`<button class="btn ghost sm" data-act="toggle-arch">${ico("archive","sm")}${S.showArchived?"Ocultar archivadas":"Ver archivadas"} <span class="num">${archived}</span></button>`:""}
    </div>
    <div class="board-wrap"><div class="board">${COLS.map(c=>{
      const list=ts.filter(t=>(t.column||"todo")===c.id).sort(byOrder);
      return `<section class="col" aria-label="${c.name}"><div class="col-h c-${c.id}"><span class="dot"></span>${c.name} <span class="cnt">${list.length}</span></div>
      <div class="col-body" data-col="${c.id}">${list.map(card).join("")}
      ${S.canWrite?`<button class="add-card" data-act="new-task" data-col="${c.id}">${ico("plus","sm")}Nueva tarea</button>`:list.length?"":`<div class="empty-col">Sin tareas</div>`}</div></section>`;
    }).join("")}</div></div></div>`;
}
function card(t){
  const m=hitosOn()&&t.milestoneId&&S.milestones[t.milestoneId];
  const subs=t.subtasks||[];const sd=subs.filter(s=>s.done).length;
  const docs=(t.docs||[]).length;
  const ppl=(t.assignees||[]);
  const late=isLate(t);
  const range=fmtRange(t.start,t.end);
  return `<article class="card ${t.column==="done"?"is-done":""} ${t.archived?"is-arch":""}" ${S.canWrite?'draggable="true"':""} data-id="${t.id}" data-act="open-task" tabindex="0" role="button" aria-label="${esc(t.title)}">
    <div class="card-t">${esc(t.title||"Sin título")}</div>
    <div class="tags">${m?`<span class="tag hito">${ico("flag","sm")}<span>${esc(m.name)}</span></span>`:""}${t.priority&&t.priority!=="none"?`<span class="tag p-${t.priority}">${PRINAME[t.priority]}</span>`:""}${t.archived?`<span class="tag neutral">Archivada</span>`:""}</div>
    ${range||subs.length||docs?`<div class="meta">${range?`<span class="${late?"late":""}">${ico("cal","sm")}${esc(range)}${late?" · vencida":""}</span>`:""}${subs.length?`<span>${ico("sub","sm")}${sd}/${subs.length}</span>`:""}${docs?`<span>${ico("clip","sm")}${docs}</span>`:""}</div>`:""}
    ${ppl.length?`<div class="people">${ppl.slice(0,3).map(id=>`<span class="person">${av(id)}${esc(first(id))}</span>`).join("")}${ppl.length>3?`<span class="person">+${ppl.length-3}</span>`:""}</div>`:""}
  </article>`;
}

function viewInicio(){
  const h=head("Inicio","home",curProject()?newTaskBtn():"");
  if(!curProject())return h+noProject();
  const ts=taskList().filter(t=>!t.archived);
  const counts=COLS.map(c=>[c,ts.filter(t=>(t.column||"todo")===c.id).length]);
  const mine=ts.filter(t=>t.column!=="done"&&((t.assignees||[]).includes(S.me.id)||(t.subtasks||[]).some(s=>s.assignee===S.me.id&&!s.done))).sort((a,b)=>(a.end||"9").localeCompare(b.end||"9"));
  const late=ts.filter(isLate).sort((a,b)=>a.end.localeCompare(b.end));
  const ms=projMilestones().filter(m=>!hitoStats(m.id).complete).slice(0,4);
  const p=curProject();
  const tli=t=>`<button class="li" data-act="open-task" data-id="${t.id}"><span class="grow"><span class="t" style="display:block">${esc(t.title)}</span><span class="s">${esc(COLNAME[t.column||"todo"])}${t.end?" · "+esc(fmtRange(t.start,t.end)):""}</span></span>${isLate(t)?`<span class="tag late">Vencida</span>`:t.priority&&t.priority!=="none"?`<span class="tag p-${t.priority}">${PRINAME[t.priority]}</span>`:""}</button>`;
  return h+`<div class="content">
    <div class="toolbar">${projectSwitcher()}<span class="hint">${p.start||p.end?esc(fmtRange(p.start,p.end)):""}</span></div>
    <div class="stat-row">${counts.map(([c,n])=>`<div class="stat c-${c.id}"><span><i class="dot"></i>${c.name}</span><b>${n}</b></div>`).join("")}</div>
    <div class="grid-2">
      <section class="panel"><div class="panel-h"><h2>Mis tareas abiertas</h2><span class="hint">${mine.length}</span></div><div class="panel-b"><div class="list">${mine.slice(0,8).map(tli).join("")||`<div class="empty"><p>No tienes tareas abiertas en este proyecto.</p></div>`}</div></div></section>
      ${hitosOn()?`<section class="panel"><div class="panel-h"><h2>Próximos hitos</h2><button class="link-btn" data-act="go" data-v="hitos">Ver todos</button></div><div class="panel-b"><div class="list">${ms.map(m=>{const s=hitoStats(m.id);const pct=s.total?Math.round(s.done/s.total*100):0;return `<div class="li"><span class="grow"><span class="t" style="display:block">${esc(m.name)}</span><span class="s">${m.date?esc(fmt(m.date)):"Sin fecha"} · ${s.done} de ${s.total} tareas</span><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></span>${m.date&&m.date<today()?`<span class="tag late">Vencido</span>`:""}</div>`}).join("")||`<div class="empty"><p>No hay hitos pendientes.</p></div>`}</div></div></section>`:""}
    </div>
    ${late.length?`<section class="panel"><div class="panel-h"><h2>Tareas vencidas</h2><span class="hint">${late.length}</span></div><div class="panel-b"><div class="list">${late.slice(0,10).map(tli).join("")}</div></div></section>`:""}
  </div>`;
}

function viewHitos(){
  const can=S.isOwner||S.demo;
  const h=head("Tareas","tasks",curProject()&&can?`<button class="btn primary" data-act="new-hito">${ico("plus","sm")}Nuevo hito</button>`:"");
  if(!curProject())return h+noProject();
  const q=S.q.trim().toLowerCase(),ft=filteredTasks();
  const ms=projMilestones().filter(m=>(!q&&!S.person)||(!S.person&&((m.name||"")+" "+(m.description||"")).toLowerCase().includes(q))||ft.some(t=>t.milestoneId===m.id));
  const noHito=taskList().filter(t=>!t.archived&&(!t.milestoneId||!S.milestones[t.milestoneId])).length;
  return h+`<div class="content"><div class="toolbar">${projectSwitcher()}${personFilter()}${searchBox()}${viewTabs()}</div>
  ${!ms.length&&(q||S.person)?`<div class="panel"><div class="empty"><p>Ningún hito coincide con la búsqueda o la persona elegida.</p></div></div>`:ms.length?`<div class="hitos">${ms.map(m=>{
    const s=hitoStats(m.id);const pct=s.total?Math.round(s.done/s.total*100):0;
    const st=s.complete?`<span class="tag ok">Cumplido</span>`:m.date&&m.date<today()?`<span class="tag late">Vencido</span>`:s.done?`<span class="tag warn">En curso</span>`:`<span class="tag neutral">Sin empezar</span>`;
    return `<article class="hito-card"><div class="row"><span>${m.date?ico("cal","sm")+" "+esc(fmt(m.date)):"Sin fecha"}</span>${st}</div>
      <h3>${ico("flag","sm")}${esc(m.name)}</h3>${m.description?`<p>${esc(m.description)}</p>`:""}
      <div class="bar ${s.complete?"done":""}"><i style="width:${pct}%"></i></div>
      <div class="row"><span>${s.done} de ${s.total} tareas hechas</span><span style="display:flex;gap:4px">
        <button class="btn ghost sm" data-act="hito-tasks" data-id="${m.id}">Ver tareas</button>
        ${can?`<button class="icon-btn" data-act="edit-hito" data-id="${m.id}" aria-label="Editar hito">${ico("edit","sm")}</button>`:""}</span></div></article>`;
  }).join("")}</div>`:`<div class="panel"><div class="empty">${ico("flag","lg")}<h3>Este proyecto no tiene hitos</h3><p>Los hitos marcan las entregas grandes del proyecto. Cada tarea se asocia a un hito para ver el avance.</p>${can?`<button class="btn primary" data-act="new-hito">${ico("plus","sm")}Crear el primer hito</button>`:""}</div></div>`}
  ${noHito?`<div class="notice">${ico("info","sm")}<span>${noHito} ${noHito===1?"tarea no tiene":"tareas no tienen"} hito asignado.</span></div>`:""}
  </div>`;
}

function viewCrono(){
  const h=head("Tareas","tasks",curProject()?newTaskBtn():"");
  if(!curProject())return h+noProject();
  if(!S.calQ){const d=new Date();S.calQ={y:d.getFullYear(),q:Math.floor(d.getMonth()/3)}}
  const {y,q}=S.calQ;
  const start=iso(new Date(y,q*3,1)),end=iso(new Date(y,q*3+3,0)),t0=today();
  const days=diffDays(start,end)+1;
  const DW=11;
  const dayIdx=s=>diffDays(start,s);
  const bar=(a,b,cls,label,id,thin)=>{
    if(!a&&!b)return"";
    a=a||b;b=b||a;if(b<start||a>end)return"";
    const i=Math.max(0,dayIdx(a)),j=Math.min(days-1,dayIdx(b));
    const w=Math.max(DW,(j-i+1)*DW);
    return `<button class="tl-bar ${cls} ${thin?"thin":""}" style="left:${i*DW}px;width:${w}px" data-act="open-task" data-id="${id}" title="${esc(label)} · ${esc(fmtRange(a,b))}" aria-label="${esc(label)}"></button>${thin?"":`<span class="tl-blabel" style="left:${i*DW+w+8}px">${esc(label)}</span>`}`;
  };
  const todayLine=t0>=start&&t0<=end?`<span class="tl-today" style="left:${dayIdx(t0)*DW+DW/2-1}px"></span>`:"";
  const track=inner=>`<div class="tl-track" style="width:${days*DW}px">${todayLine}${inner}</div>`;
  const ts=filteredTasks().filter(t=>!t.archived);
  const groups=projMilestones().map(m=>({m,ts:ts.filter(t=>t.milestoneId===m.id)})).filter(g=>g.ts.length||!(S.q.trim()||S.person));
  const orphan=ts.filter(t=>!hitosOn()||!t.milestoneId||!S.milestones[t.milestoneId]);
  if(orphan.length)groups.push({m:null,ts:orphan});
  const rows=groups.map(g=>{
    const m=g.m;const done=m&&hitoStats(m.id).complete;
    const dia=m&&m.date&&m.date>=start&&m.date<=end?`<span class="tl-dia ${done?"done":""}" style="left:${dayIdx(m.date)*DW+DW/2-7}px" title="${esc(m.name)} · ${esc(fmt(m.date))}"></span>`:"";
    let html=`<div class="tl-row grp"><div class="tl-lab grp">${ico(m?"flag":"tasks","sm")}<span class="t">${esc(m?m.name:hitosOn()?"Sin hito":"Tareas")}</span>${m&&m.date?`<span class="hint">${esc(fmt(m.date))}</span>`:""}</div>${track(dia)}</div>`;
    g.ts.sort((a,b)=>(a.start||a.end||"9").localeCompare(b.start||b.end||"9")).forEach(t=>{
      const off=(t.start||t.end)&&((t.end||t.start)<start||(t.start||t.end)>end);
      const subsD=(t.subtasks||[]).filter(s=>s.start||s.end);const hid=S.subHidden.has(t.id);
      html+=`<div class="tl-row"><button class="tl-lab" data-act="open-task" data-id="${t.id}">${subsD.length?`<span class="tl-tog ${hid?"":"open"}" role="button" tabindex="0" data-act="sub-tog" data-id="${t.id}" aria-label="${hid?"Mostrar":"Ocultar"} subtareas" title="${hid?"Mostrar":"Ocultar"} subtareas (${subsD.length})">${ico("right","sm")}</span>`:`<span class="tl-tog-sp"></span>`}<span class="st-dot ${t.column||"todo"}" title="${esc(COLNAME[t.column||"todo"])}"></span><span class="t">${esc(t.title)}</span>${!t.start&&!t.end?`<span class="hint">sin fechas</span>`:off?`<span class="hint">${esc(fmtRange(t.start,t.end))}</span>`:""}</button>${track(bar(t.start,t.end,t.column||"todo",t.title,t.id))}</div>`;
      if(!hid)subsD.forEach(s=>{
        html+=`<div class="tl-row"><button class="tl-lab subt" data-act="open-task" data-id="${t.id}">${ico("sub","sm")}<span class="t">${esc(s.title||"Subtarea")}</span></button>${track(bar(s.start,s.end,s.done?"done":(t.column||"todo"),s.title,t.id,true))}</div>`;
      });
    });
    return html;
  }).join("");
  const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const months=[0,1,2].map(k=>{const ms=iso(new Date(y,q*3+k,1)),me=iso(new Date(y,q*3+k+1,0));return `<span class="tl-month" style="left:${dayIdx(ms)*DW}px;width:${(diffDays(ms,me)+1)*DW}px">${MESL[q*3+k]}</span>`}).join("");
  let ticks="";for(let k=0;k<days;k++){const s=addDays(start,k);if(parse(s).getDay()===1)ticks+=`<span class="tl-tick ${s===mondayOf(t0)?"cur":""}" style="left:${k*DW}px">${parse(s).getDate()}</span>`}
  const todayTag=t0>=start&&t0<=end?`<span class="tl-todaytag" style="left:${dayIdx(t0)*DW+DW/2}px">Hoy</span>`:"";
  return h+`<div class="content">
  <div class="toolbar">${projectSwitcher()}${personFilter()}${searchBox()}${viewTabs()}<span class="grow"></span>
    ${(()=>{const ids=ts.filter(t=>(t.subtasks||[]).some(s=>s.start||s.end)).map(t=>t.id);if(!ids.length)return"";const allHid=ids.every(i=>S.subHidden.has(i));return `<button class="btn sm" data-act="sub-tog-all" data-hide="${allHid?0:1}">${ico("sub","sm")}${allHid?"Mostrar subtareas":"Ocultar subtareas"}</button>`})()}
    <span class="qnav"><button class="icon-btn" data-act="cal-prev" aria-label="Trimestre anterior">${ico("left")}</button>
    <b class="q-label">Q${q+1} ${y}</b>
    <button class="icon-btn" data-act="cal-next" aria-label="Trimestre siguiente">${ico("right")}</button>
    <button class="btn sm" data-act="cal-today">Hoy</button></span></div>
  <div class="legend"><span><i class="lg-todo"></i>Sin empezar</span><span><i class="lg-doing"></i>En progreso</span><span><i class="lg-review"></i>En revisión</span><span><i class="lg-done"></i>Hecho</span>${hitosOn()?`<span><i style="background:var(--accent);transform:rotate(45deg) scale(.8)"></i>Hito</span>`:""}</div>
  ${groups.length?`<div class="tl-wrap"><div class="tl"><div class="tl-row tl-head"><div class="tl-lab">Tarea</div><div class="tl-scale" style="width:${days*DW}px">${months}${ticks}${todayTag}</div></div>${rows}</div></div>`:`<div class="panel"><div class="empty"><p>No hay tareas que mostrar. Ponles fechas para verlas en el cronograma.</p></div></div>`}
  </div>`;
}

function viewEquipo(){
  const can=S.isOwner||S.demo;
  const h=head("Equipo","users",can?`<button class="btn primary" data-act="inv-open">${ico("plus","sm")}<span>Invitar persona</span></button>`:"");
  const ids=memberIds().sort((a,b)=>(S.members[a].addedAt||0)-(S.members[b].addedAt||0));
  const projOf=id=>Object.entries(S.projects).filter(([pid,p])=>!p.archived&&((p.memberIds||[]).includes(id)||p.ownerId===id)).map(([pid,p])=>p.name);
  return h+`<div class="content">
  <section class="panel"><div class="panel-h"><h2>Personas</h2><span class="hint">${ids.length}</span></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Persona</th><th>Proyectos</th><th>Agregada</th><th></th></tr></thead><tbody>

async function apiCall(path,method,body){
  const token=await window.appAuth.token();
  const r=await fetch(path,{method:method||"GET",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Algo falló. Intenta de nuevo.");
  return j;
}

/* ---------- board drag & drop ---------- */
function bindBoard(){
  if(!S.canWrite)return;
  document.querySelectorAll(".card[draggable]").forEach(el=>{
    el.addEventListener("dragstart",e=>{S.dragId=el.dataset.id;el.classList.add("dragging");try{e.dataTransfer.setData("text/plain",el.dataset.id);e.dataTransfer.effectAllowed="move"}catch(_){}});
    el.addEventListener("dragend",()=>{el.classList.remove("dragging");clearDrop();S.dragId=null});
  });
  document.querySelectorAll(".col-body").forEach(body=>{
    body.addEventListener("dragover",e=>{
      if(!S.dragId)return;e.preventDefault();
      body.classList.add("over");
      const before=cardAfter(body,e.clientY);
      let line=body.querySelector(".drop-line");
      if(!line){line=document.createElement("div");line.className="drop-line"}
      if(before)body.insertBefore(line,before);else body.insertBefore(line,body.querySelector(".add-card,.empty-col"));
    });
    body.addEventListener("dragleave",e=>{if(!body.contains(e.relatedTarget)){body.classList.remove("over");const l=body.querySelector(".drop-line");if(l)l.remove()}});
    body.addEventListener("drop",e=>{
      e.preventDefault();if(!S.dragId)return;
      const before=cardAfter(body,e.clientY);
      const id=S.dragId;clearDrop();
      moveTask(id,body.dataset.col,before?before.dataset.id:null);
    });
  });
}
function cardAfter(body,y){
  const cards=[...body.querySelectorAll(".card:not(.dragging)")];
  return cards.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2})||null;
}
function clearDrop(){document.querySelectorAll(".drop-line").forEach(l=>l.remove());document.querySelectorAll(".col-body.over").forEach(b=>b.classList.remove("over"))}
function moveTask(id,col,beforeId){
  const t=S.tasks[id];if(!t)return;
  const list=taskList().filter(x=>(x.column||"todo")===col&&x.id!==id&&!x.archived).sort(byOrder);
  let i=beforeId?list.findIndex(x=>x.id===beforeId):list.length;if(i<0)i=list.length;
  const prev=list[i-1],next=list[i];
  const order=prev&&next?((prev.order||0)+(next.order||0))/2:next?(next.order||0)-1:prev?(prev.order||0)+1:1;
  if((t.column||"todo")===col&&t.order===order)return;
  const patch={column:col,order,updatedAt:Date.now()};
  if(col==="done"&&t.column!=="done")patch.doneAt=Date.now();
  if(col!=="done")patch.doneAt=null;
  safe(()=>wupd("tasks",id,patch),col!==(t.column||"todo")?"Movida a "+COLNAME[col]:"");
}

async function saveTask(){
  const m=S.modal,d=m.draft;
  m.err="";
  if(!d.title.trim()){m.err="Escribe el título de la tarea.";renderModal();$("#f-title").focus();return}
  if(projMilestones().length&&!d.milestoneId){m.err="hito";renderModal();return}
  if(d.start&&d.end&&d.end<d.start){m.err="dates";renderModal();return}
  const now=Date.now();
  const body={title:d.title.trim(),como:d.como,quiero:d.quiero,para:d.para,description:d.description,milestoneId:d.milestoneId||"",priority:d.priority,start:d.start||"",end:d.end||"",assignees:d.assignees,
    subtasks:d.subtasks.filter(s=>s.title.trim()||s.assignee||s.start||s.end),criteria:d.criteria.filter(c=>c.text.trim()),docs:d.docs,archived:!!d.archived,updatedAt:now};
  let ok;
  if(m.isNew){
    const inCol=taskList().filter(t=>(t.column||"todo")===d.column);
    Object.assign(body,{projectId:S.projectId,column:d.column,order:inCol.reduce((a,t)=>Math.max(a,t.order||0),0)+1,createdAt:now,createdBy:S.me.id,doneAt:d.column==="done"?now:null});
    ok=await safe(()=>wset("tasks",m.id,body),"Tarea creada");
  }else{

    if(d.column!==(cur.column||"todo")){
      const inCol=taskList().filter(t=>(t.column||"todo")===d.column);
      body.column=d.column;body.order=inCol.reduce((a,t)=>Math.max(a,t.order||0),0)+1;body.doneAt=d.column==="done"?now:null;
    }
    ok=await safe(()=>wupd("tasks",m.id,body),"Cambios guardados");
    if(ok&&S.assets){
      const keep=new Set(d.docs.filter(x=>x.assetId).map(x=>x.assetId));
      (m.orig.docs||[]).filter(x=>x.assetId&&!keep.has(x.assetId)).forEach(x=>S.assets.delete(x.assetId).catch(()=>{}));
    }
  }
  if(ok){m.newAssets=[];closeModal(true)}
}
async function deleteTask(){
  const m=S.modal;const t=S.tasks[m.id];
  const ok=await safe(()=>wdel("tasks",m.id),"Tarea borrada");
  if(!ok)return;
  const cids=Object.entries(S.comments).filter(([,c])=>c.taskId===m.id).map(([id])=>id);
  for(const id of cids){await safe(()=>wdel("comments",id))}
  if(S.assets&&t)(t.docs||[]).filter(x=>x.assetId).forEach(x=>S.assets.delete(x.assetId).catch(()=>{}));
  m.newAssets.forEach(a=>S.assets&&S.assets.delete(a).catch(()=>{}));m.newAssets=[];
  closeModal(true);
}
async function uploadFiles(files){
  const m=S.modal;if(!m)return;
  for(const file of files){
    const ext=(file.name.split(".").pop()||"").toLowerCase();
    const type=UPLOAD_TYPES[ext];
    const ctype=type||file.type||"application/octet-stream";
    if(file.size>50*1048576){toast(`"${file.name}" pesa más de 50 MB.`,true);continue}
    if(S.demo){m.draft.docs.push({id:uid(),kind:"file",name:file.name,size:file.size,url:URL.createObjectURL(file),by:S.me.id,at:Date.now()});continue}
    m.uploading++;renderModal();
    try{
      const r=await S.assets.upload(file,{type:ctype});
      m.newAssets.push(r.id);
      m.draft.docs.push({id:uid(),kind:"file",name:file.name,size:r.sizeBytes,assetId:r.id,url:r.url,type:r.contentType,by:S.me.id,at:Date.now()});
    }catch(e){console.error(e);toast(errMsg(e),true)}
    m.uploading--;
  }
  renderModal();
}

// Recorta la imagen al centro en un cuadrado de 320 px y la convierte a JPEG liviano.
function squareJpeg(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const side=Math.min(img.naturalWidth,img.naturalHeight),size=Math.min(320,side);
      const c=document.createElement("canvas");c.width=c.height=size;
      c.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);
      URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(new Error("No se pudo leer la imagen.")),"image/jpeg",0.86)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Ese archivo no es una imagen. Usa una foto JPG o PNG."))};
    img.src=url;
  });
}

/* ---------- toast ---------- */
let tt;
function toast(msg,bad){if(!msg)return;const el=$("#toast");el.textContent=msg;el.className="show"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>{el.className=bad?"bad":""},bad?4200:2200)}

/* ---------- boot ---------- */
async function start(){
  const h=(location.hash||"").replace("#","");
  if(VIEWS.includes(h))S.view=h;
  render();
  const c=window.claude;
  if(!c||typeof c.use!=="function"){enterDemo("");return}
  let db,user;
  try{[db,user]=await Promise.all([c.use("db"),c.use("user")])}catch(e){db=null}
  if(!db||!user){enterDemo("");return}
  const me=await user.me();
  if(!me.id){enterDemo("signin");return}
  S.db=db;S.user=user;S.me=me;S.isOwner=!!me.isOwner;
  if(window.appWorkspace)S.ws=await window.appWorkspace.info();
  const cw=await user.can("data.write");S.canWrite=cw!==false;
  c.use("assets").then(a=>{S.assets=a;if(S.modal&&S.modal.kind==="task")renderModal()}).catch(()=>{});
  S.profiles[me.id]={id:me.id,name:me.name,avatarUrl:me.avatarUrl,color:me.color,email:me.email,isMe:true,guest:false};
  S.boot=false;render();
  db.collection("members").onSnapshot(snap=>{
    S.members=mapDocs(snap);
    if(!snap.metadata.fromCache)S.membersReady=true;
    if(S.isOwner&&S.membersReady&&!S.members[me.id]&&!S.ownerWritten){
      S.ownerWritten=true;
      safe(()=>wset("members",me.id,{addedAt:Date.now(),addedBy:me.id,title:"",role:"admin"}));
    }
    loadProfiles(Object.keys(S.members));
    render();
  },onErr);
  db.collection("projects").onSnapshot(snap=>{
    S.projects=mapDocs(snap);S.projectsReady=true;
    ensureProject();
    const ids=[];Object.values(S.projects).forEach(p=>ids.push(...(p.memberIds||[])));loadProfiles(ids);
    render();
  },onErr);
  db.collection("milestones").onSnapshot(snap=>{S.milestones=mapDocs(snap);render()},onErr);
}

start();
})();
